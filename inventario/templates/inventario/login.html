{% extends 'inventario/base.html' %} {% block content %}
<h2>Login</h2>
<p>Digite seu usuário e senha para acessar o sistema.</p>

<form method="post" class="form-login">
  {% csrf_token %} {{ form.non_field_errors }}

  <div class="form-group">
    <label for="id_username">Usuário:</label>
    {{ form.username }}
  </div>

  <div class="form-group">
    <label for="id_password">Senha:</label>
    {{ form.password }}
  </div>

  <button type="submit" class="btn">Entrar</button>
</form>

<style>
  .form-login {
    max-width: 400px;
    margin-top: 20px;
  }
  .form-group {
    margin-bottom: 15px;
  }
  label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
  }
  .btn {
    padding: 8px 16px;
    border-radius: 4px;
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
  }
  .btn:hover {
    background: #0056b3;
  }
</style>
{% endblock %}
