{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %} Formiguinhas.com {% endblock %}</title>
    <!-- <link rel="icon" type="image/svg+xml" href="{% static 'images/mercado.svg' %}"> -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block estilos %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <a href="{% url 'index' %}" class="brand-link" aria-label="Ir para a página inicial">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">🐜</span>
                <h1>Formiguinhas.com</h1>
            </div>
        </a>
        <nav class="main-nav" aria-label="Navegação principal">
            <a href="{% url 'index' %}" class="nav-link">Início</a>
            <a href="{% url 'index' %}#quem-somos" class="nav-link">Quem somos</a>
            {% block navegacao_extra %}{% endblock %}
        </nav>
    </header>
    <main>
        {% block conteudo %}
        {% endblock %}
    </main>
</body>

</html>
